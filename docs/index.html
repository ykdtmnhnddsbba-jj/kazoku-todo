<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF7FF">
<title>HOME✦MISSION</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF7FF; --card: #fff; --ink: #13233A; --sub: #5B6B82; --line: #13233A; --soft-line: #C9DCEB;
    --pink: #FF5E7E; --pink-soft: #FFE0E7; --yellow: #FFD23F; --yellow-soft: #FFF3B8;
    --mint: #3EC6A8; --mint-soft: #D5F5EC; --blue: #2B7FFF; --blue-soft: #DCEBFF;
    --accent: var(--pink); --accent-soft: var(--pink-soft); --ok: #138A6F; --ok-soft: var(--mint-soft);
    --b: 2.5px solid var(--ink); --pop: 3px 3px 0 var(--ink); --pop-lg: 4px 4px 0 var(--ink);
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif; font-weight: 500; }
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom));
    background-image: radial-gradient(#C9E6FA 1.2px, transparent 1.2px); background-size: 18px 18px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  b, strong, h1, h2, h3 { font-weight: 800; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 12px 16px 24px; }

  /* ヘッダー */
  header.top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 2px; max-width: 980px; margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; letter-spacing: .02em; margin: 0; }
  .logo .dots { display: inline-flex; gap: 3px; }
  .logo .dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
  .logo .star { color: var(--pink); margin: 0 1px; display: inline-block; transform: translateY(-1px); }
  header.top .me { margin-left: auto; font-size: 14px; font-weight: 800; background: var(--card); border: var(--b);
    border-radius: 999px; padding: 4px 12px 4px 6px; box-shadow: var(--pop); white-space: nowrap; }

  /* 日付 */
  .daynav { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; }
  .daynav .date { font-size: 22px; font-weight: 800; }
  .daynav .date small { font-size: 12px; font-weight: 800; margin-left: 8px; background: var(--yellow); border: 2px solid var(--ink);
    border-radius: 999px; padding: 2px 8px; vertical-align: 3px; }
  .daynav .sp { flex: 1; }
  .iconbtn { border: var(--b); background: var(--card); border-radius: 14px; min-width: 42px; height: 42px; padding: 0 12px;
    font-weight: 800; box-shadow: var(--pop); transition: transform .08s, box-shadow .08s; }
  .iconbtn:active, .btn:active, .item:active, .who-pick button:active, .fab:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

  .banner { background: var(--yellow-soft); border: var(--b); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
    display: flex; gap: 10px; align-items: center; box-shadow: var(--pop); }
  .banner p { margin: 0; flex: 1; font-size: 14px; }

  /* カード */
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--card); border-radius: var(--radius); border: var(--b); box-shadow: var(--pop-lg); padding: 14px 16px; position: relative; }
  .card.mine::before { content: ''; position: absolute; left: 5px; top: 16px; bottom: 16px; width: 4px; background: var(--pink); border-radius: 4px; }
  .card.alldone { background: var(--mint-soft); }
  .card.alldone h3 { color: #2C5E54; }
  .card.skipped { background: #F1F4F8; box-shadow: 2px 2px 0 var(--soft-line); border-color: var(--soft-line); color: var(--sub); }
  .card .row1 { display: flex; align-items: baseline; gap: 10px; }
  .card .time { font-size: 15px; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; }
  .card.alldone .time { color: var(--ok); }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.4; flex: 1; }
  .card .note { color: var(--sub); font-size: 13px; margin: 4px 0 0; white-space: pre-wrap; }
  .card .more { border: none; background: none; color: var(--sub); font-size: 22px; line-height: 1; padding: 0 2px; font-weight: 800; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 13px; font-weight: 800;
    background: var(--card); border: 2px solid var(--ink); }
  .chip.done { background: var(--yellow); }
  .chip.wait { background: #fff; color: var(--ink); }
  .chip.nag { background: var(--pink-soft); color: #9A1E3B; }
  button.chip { cursor: pointer; }

  .checks { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--blue-soft); border: 2px solid var(--ink); border-radius: 14px; font-size: 15px; font-weight: 800; }
  .checks input { appearance: none; width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: 7px; background: #fff; margin: 0; flex: none; display: grid; place-content: center; }
  .checks input:checked { background: var(--mint); }
  .checks input:checked::after { content: '✓'; color: #fff; font-weight: 800; font-size: 15px; line-height: 1; }
  .checks .on { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--sub); }

  /* ボタン */
  .act { margin-top: 14px; display: flex; gap: 8px; }
  .btn { border: var(--b); border-radius: 999px; padding: 11px 18px; font-weight: 800; background: var(--pink); color: #fff; box-shadow: var(--pop);
    transition: transform .08s, box-shadow .08s; }
  .btn.big { flex: 1; font-size: 17px; }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.ok { background: var(--mint); }
  .btn.danger { background: #fff; color: #C0234B; border-color: #C0234B; box-shadow: 3px 3px 0 #C0234B; }
  .btn:disabled { opacity: .6; }

  /* 完了の帯とスタンプ */
  .donebar { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: var(--mint); border: var(--b); border-radius: 16px; padding: 10px 12px; color: #fff; position: relative; }
  .donebar .ck { font-size: 22px; width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--mint); border: 2px solid var(--ink); display: grid; place-content: center; font-weight: 800; flex: none; }
  .donebar .dt { flex: 1; display: flex; flex-direction: column; text-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .donebar .dt b { font-size: 17px; }
  .donebar .dt small { font-size: 12px; }
  .donebar .undo { border: none; background: none; color: #fff; font-size: 12px; text-decoration: underline; padding: 6px; font-weight: 800; }
  .stamp { position: absolute; right: 12px; top: 10px; background: var(--yellow); color: var(--ink); border: var(--b); border-radius: 10px;
    padding: 3px 10px; font-weight: 800; font-size: 14px; letter-spacing: .04em; transform: rotate(8deg); box-shadow: 2px 2px 0 var(--ink); }
  .stamp.new { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes stamp { 0% { transform: rotate(-20deg) scale(2.2); opacity: 0; } 100% { transform: rotate(8deg) scale(1); opacity: 1; } }

  .empty { text-align: center; color: var(--sub); padding: 40px 0; font-weight: 800; }
  .empty .em { font-size: 44px; }

  /* 一覧 */
  h2.sec { font-size: 13px; color: var(--ink); margin: 22px 4px 10px; font-weight: 800; letter-spacing: .08em; display: inline-block;
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; }
  .list { display: grid; gap: 10px; }
  .item { background: var(--card); border-radius: 16px; border: var(--b); box-shadow: var(--pop); padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    transition: transform .08s, box-shadow .08s; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .t span { font-size: 12px; color: var(--sub); font-weight: 800; }
  .item.off { opacity: .5; }
  .item .who { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }

  .fab { position: fixed; right: 18px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 50%;
    background: var(--pink); color: #fff; border: 3px solid var(--ink); font-size: 32px; font-weight: 800; box-shadow: var(--pop-lg); line-height: 1; }

  /* 編集 */
  form.edit { background: var(--card); border-radius: var(--radius); border: var(--b); box-shadow: var(--pop-lg); padding: 16px; display: grid; gap: 16px; }
  .field > label, .field > .lbl { display: block; font-size: 13px; color: var(--ink); margin-bottom: 6px; font-weight: 800; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field textarea, .field select {
    width: 100%; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: #fff; font-weight: 800; }
  .field input:focus, .field textarea:focus { outline: none; box-shadow: 0 0 0 3px var(--yellow); }
  .field textarea { min-height: 84px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 12px; min-width: 44px; font-weight: 800; }
  .seg button.on { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
  .hint { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .formact { display: flex; gap: 8px; }
  .formact .btn { flex: 1; }

  /* 設定 */
  .panel { background: var(--card); border-radius: var(--radius); border: var(--b); box-shadow: var(--pop-lg); padding: 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 16px; }
  .panel p { margin: 6px 0; font-size: 14px; }
  .mrow { display: grid; grid-template-columns: 52px 56px 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
  .mrow input { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; width: 100%; background: #fff; text-align: center; font-weight: 800; }
  .mrow input + input { text-align: left; }
  .who-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .who-pick button { background: var(--card); border: var(--b); border-radius: 20px; padding: 18px 8px; font-size: 16px; font-weight: 800; box-shadow: var(--pop-lg);
    transition: transform .08s, box-shadow .08s; }
  .who-pick button.on { background: var(--yellow); }
  code.url { display: block; word-break: break-all; background: var(--blue-soft); border: 2px solid var(--ink); padding: 8px 10px; border-radius: 10px; font-size: 12px; }

  /* 顔アイコン */
  .av { display: inline-block; width: 22px; height: 22px; border-radius: 50%; object-fit: cover; vertical-align: -5px; background: #fff; border: 1.5px solid var(--ink); }
  span.av { width: auto; height: auto; background: none; vertical-align: 0; border: none; }
  .who-pick .av { width: 68px; height: 68px; display: block; margin: 0 auto 8px; font-size: 44px; line-height: 68px; border-width: 2.5px; }
  .who-pick span.av { border: none; }
  .item .who .av { width: 28px; height: 28px; margin-left: -6px; border: 2px solid var(--ink); }
  .item .who span.av { border: none; }
  .avbtn { width: 48px; height: 48px; border-radius: 50%; border: var(--b); background: var(--yellow-soft); padding: 0; position: relative; font-size: 24px; overflow: visible; }
  .avbtn img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
  .avbtn .cam { position: absolute; right: -4px; bottom: -4px; font-size: 11px; background: #fff; border: 1.5px solid var(--ink); border-radius: 50%; width: 20px; height: 20px; line-height: 17px; }

  /* 下のタブ */
  nav.tabs { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); background: #fff; border: var(--b); border-radius: 22px;
    box-shadow: var(--pop-lg); display: flex; padding: 6px; gap: 6px; z-index: 5; max-width: 560px; margin: 0 auto; }
  nav.tabs[hidden], [hidden] { display: none !important; }
  nav.tabs a { flex: 1; text-align: center; padding: 6px 0 7px; color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 800; border-radius: 16px; border: 2px solid transparent; }
  nav.tabs a .i { display: block; font-size: 20px; line-height: 1.25; }
  nav.tabs a.on { background: var(--pink); color: #fff; border-color: var(--ink); }

  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 800; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; white-space: nowrap; border: 2px solid var(--yellow); }
  .toast.show { opacity: 1; }
  .menu { position: absolute; right: 10px; top: 40px; background: #fff; border: var(--b); border-radius: 14px; box-shadow: var(--pop); z-index: 3; overflow: hidden; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 11px 16px; font-size: 14px; font-weight: 800; white-space: nowrap; }
  .menu button + button { border-top: 2px solid var(--ink); }
  .filter { display: flex; gap: 6px; margin: 4px 0 14px; }
  .filter button { border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; }
  .filter button.on { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
  .time.someday { color: var(--pink); font-size: 12px; border: 2px solid var(--pink); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
  .lead { color: var(--sub); font-size: 13px; margin: 0 4px 12px; }
  .loading { text-align: center; color: var(--sub); padding: 30px; font-weight: 800; }
</style>
</head>
<body>
<header class="top">
  <h1 class="logo"><span class="dots" aria-hidden="true"><i style="background:#FF5E7E"></i><i style="background:#FFD23F"></i><i style="background:#3EC6A8"></i></span><span>HOME<span class="star">✦</span>MISSION</span></h1>
  <span class="me" id="meBadge" hidden></span>
</header>
<main class="wrap" id="view"><div class="loading">読み込み中…</div></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#today" data-tab="today"><span class="i">🎯</span>本日任務</a>
  <a href="#someday" data-tab="someday"><span class="i">📦</span>未定任務</a>
  <a href="#list" data-tab="list"><span class="i">🛰️</span>指令室</a>
  <a href="#settings" data-tab="settings"><span class="i">⚙️</span>設定</a>
</nav>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
